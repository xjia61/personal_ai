services:
  db:
    image: postgres:16
    container_name: personal-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: personal_ai
      POSTGRES_USER: personal_ai
      POSTGRES_PASSWORD: personal_ai
    ports:
      - "5433:5432"
    volumes:
      - personal_ai_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U personal_ai -d personal_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  personal_ai_postgres_data:
